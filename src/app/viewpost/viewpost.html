<app-navbar></app-navbar>
<app-loader *ngIf="isLoading"></app-loader>

<div class="page-container" *ngIf="!isLoading">

    <!-- LEFT SIDEBAR -->
    <aside class="left-sidebar">

        <!-- BACK BUTTON -->
        <button class="icon-btn back-icon" routerLink="/" title="Back to Home">
            ←
        </button>

        <!-- LIKE BUTTON -->
        <button class="icon-btn" (click)="toggleLike()">
            <i class="bx" [ngClass]="isLiked ? 'bxs-heart liked' : 'bx-heart'">
            </i>
            <span>{{ post.likes }}</span>
        </button>

        <!-- SAVE BUTTON (UPDATED) -->
        <button class="icon-btn" (click)="toggleSave()">
            <i class="bx" [ngClass]="isSaved ? 'bxs-bookmark saved' : 'bx-bookmark'">
            </i>
            <span>{{ post.saves }}</span>
        </button>

    </aside>

    <!-- CENTER CONTENT -->
    <main class="post-content">

        <img [src]="post.coverImage || 'assets/default.jpg'" class="cover-image" />

        <h1 class="post-title">{{ post.title }}</h1>

        <div class="post-meta">
            <span>@{{ post.username }}</span>
            <span>• {{ post.postedAgo }}</span>
        </div>

        <p class="post-text">
            {{ post.content }}
        </p>

        <div class="tags">
            <span class="tag" *ngFor="let tag of post.tags">
                #{{ tag }}
            </span>
        </div>

    </main>

    <!-- RIGHT SIDEBAR -->
    <aside class="right-sidebar">

        <!-- USER CARD -->
        <div class="user-card">
            <img [src]="user.profilePic || 'assets/default-user.png'" class="profile-pic" />

            <h3>{{ user.username }}</h3>

            <div class="user-stats">
                <span><b>{{ user.followers }}</b> Followers</span>
            </div>

            <button class="follow-btn" [class.following]="isFollowing" (click)="toggleFollow()">
                {{ isFollowing ? 'Following' : 'Follow' }}
            </button>

            <p class="total-posts">
                Total Posts: {{ user.totalPosts }}
            </p>
        </div>

        <!-- MORE POSTS -->
        <div class="more-posts">
            <h4>More from {{ user.username }}</h4>

            <div class="mini-post" *ngFor="let p of morePosts">
                <h5>{{ p.title }}</h5>
                <p>{{ p.content }}</p>

                <div class="tags">
                    <span class="tag" *ngFor="let tag of p.tags">
                        #{{ tag }}
                    </span>
                </div>
            </div>
        </div>

    </aside>

</div>
