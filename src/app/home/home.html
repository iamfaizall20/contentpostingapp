<app-navbar></app-navbar>

<div class="layout">

    <aside class="sidebar left">
        <ul class="menu">
            <li class="active">Home</li>
            <li>About</li>
            <li>Privacy Policy</li>
            <li>Terms of Use</li>
            <li>Contact</li>
        </ul>
    </aside>

    <main class="feed">

        <!-- FEED HEADER -->
        <div class="feed-header">
            <span class="active">Discover</span>
            <span *ngIf="isLoggedIn">Following</span>
            <span>Latest</span>
            <span>Top</span>
        </div>

        <!-- POSTS -->
        <div class="feed-posts">

            <article class="post" *ngFor="let post of posts">
                <img class="cover" [src]="post.cover_image" />

                <div class="post-body">
                    <h2 class="title">{{ post.title }}</h2>

                    <p class="excerpt">{{ post.content }}</p>

                    <div class="tags">
                        <span *ngFor="let tag of post.tags">#{{ tag }}</span>
                    </div>

                    <div class="post-footer">
                        <div class="meta">
                            <span class="user">{{ post.username }}</span>
                            <span> · {{ post.timeAgo }}</span>
                        </div>

                        <div class="actions">
                            <span>🔖</span>
                            <button class="read">Read more</button>
                        </div>
                    </div>
                </div>
            </article>

        </div>
    </main>

    <aside class="sidebar right">

        <div class="card">
            <h4>Trending Topics</h4>
            <div class="pill-group">
                <span *ngFor="let topic of trendingTopics">{{ topic }}</span>
            </div>
        </div>

        <div class="card">
            <h4>Trending Tags</h4>
            <div class="tag-cloud">
                <span *ngFor="let tag of trendingTags">#{{ tag }}</span>
            </div>
        </div>

    </aside>

</div>
