<app-navbar></app-navbar>

<app-notification></app-notification>

<form #postForm="ngForm" class="create-post-page" (ngSubmit)="publishPost(postForm)">

    <!-- MAIN EDITOR -->
    <div class="editor-layout">

        <!-- LEFT PANEL -->
        <aside class="left-panel">

            <!-- COVER -->
            <section class="cover-section">
                <img *ngIf="coverPreview; else noCover" [src]="coverPreview" class="cover-img" />

                <ng-template #noCover>
                    <div class="cover-placeholder">
                        No cover yet
                    </div>
                </ng-template>

                <div class="cover-actions">
                    <label class="btn outline small">
                        Upload
                        <input type="file" hidden (change)="onCoverUpload($event)" />
                    </label>

                    <button type="button" *ngIf="coverPreview" class="btn danger small" (click)="removeCover()">
                        Remove
                    </button>
                </div>
            </section>

            <!-- TAGS -->
            <section class="tags-section">
                <div class="section-header">
                    <h4>Tags</h4>
                </div>

                <input type="text" maxlength="20" placeholder="Topics readers might search for" class="tag-input"
                    (keydown.enter)="addTag($event)" />

                <small class="helper-text">
                    Add up to 5 tags · Press Enter to add
                </small>

                <div class="tag-list">
                    <span class="tag" *ngFor="let tag of tags; let i = index">
                        {{ tag }}
                        <span class="remove" (click)="removeTag(i)">×</span>
                    </span>
                </div>
            </section>

        </aside>

        <!-- RIGHT PANEL -->
        <main class="right-panel">

            <!-- TITLE -->
            <div class="input-group">
                <div class="group-header">
                    <small class="helper-text">
                        A clear title increases reach (max 80 characters)
                    </small>
                </div>

                <input type="text" name="title" ngModel required maxlength="80"
                    placeholder="What's the main idea you want to share?" class="title-input" />
            </div>

            <!-- CONTENT -->
            <div class="input-group">
                <div class="group-header">
                    <small class="helper-text">
                        Write naturally — you can edit and format later
                    </small>
                </div>

                <textarea name="content" ngModel required maxlength="5000"
                    placeholder="Start with what inspired this post…" class="content-textarea">
                </textarea>
            </div>

        </main>

    </div>

    <!-- BOTTOM ACTION BAR -->
    <div class="editor-actions">
        <button type="button" class="btn ghost" routerLink="/">
            Discard
        </button>

        <button type="submit" class="btn primary">
            Publish
        </button>
    </div>

</form>
