<app-navbar></app-navbar>

<div class="edit-profile-page">

    <!-- LEFT TABS -->
    <aside class="settings-sidebar">
        <h3 class="sidebar-title">Settings</h3>

        <ul class="settings-menu">
            <li [class.active]="activeTab === 'profile'" (click)="setTab('profile')">
                Profile
            </li>

            <li [class.active]="activeTab === 'account'" (click)="setTab('account')">
                Account
            </li>

            <li [class.active]="activeTab === 'security'" (click)="setTab('security')">
                Security
            </li>
        </ul>

        <p class="sidebar-footer">@Contentify</p>
    </aside>

    <!-- RIGHT CONTENT -->
    <section class="settings-content">

        <!-- PROFILE -->
        <div *ngIf="activeTab === 'profile'" class="panel">
            <h2>Profile</h2>
            <p class="subtitle">Manage how others see you</p>

            <div class="avatar-box">
                <img [src]="user.profile_picture" />
                <button class="btn outline small">Change photo</button>
            </div>

            <div class="form-group">
                <label>Name</label>
                <input type="text" [(ngModel)]="user.name" />
            </div>
        </div>

        <!-- ACCOUNT -->
        <div *ngIf="activeTab === 'account'" class="panel">
            <h2>Account</h2>
            <p class="subtitle">Basic account information</p>

            <div class="form-group">
                <label>Email</label>
                <input type="email" [value]="user.email" disabled />
                <small>Email cannot be changed</small>
            </div>
        </div>

        <!-- SECURITY -->
        <div *ngIf="activeTab === 'security'" class="panel">
            <h2>Security</h2>
            <p class="subtitle">Update your password</p>

            <div class="form-group">
                <label>Current password</label>
                <input type="password" [(ngModel)]="oldpassword" />
            </div>

            <div class="form-group">
                <label>New password</label>
                <input type="password" [(ngModel)]="newpassword" />
            </div>

            <div class="form-group">
                <label>Confirm password</label>
                <input type="password" [(ngModel)]="confpassword" />
            </div>
        </div>

        <!-- ACTIONS -->
        <div class="form-actions">
            <button class="btn ghost" routerLink="/">Cancel</button>
            <button class="btn primary" (click)="saveChanges()">Save Changes</button>
        </div>

    </section>

</div>
