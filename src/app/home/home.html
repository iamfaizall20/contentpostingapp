<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-left">
        <img src="https://dev-to-uploads.s3.amazonaws.com/uploads/articles/5t2a7uyc1weqoekqueb1.png" alt="Future"
            class="logo" />
    </div>

    <div class="nav-right">
        <a routerLink="/login" class="btn outline">Login</a>
        <a routerLink="/signup" class="btn primary">Sign Up</a>
    </div>
</nav>

<!-- MAIN LAYOUT -->
<div class="layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar left">
        <ul class="menu">
            <li class="active">Home</li>
            <li>About</li>
            <li>Privacy Policy</li>
            <li>Terms of Use</li>
            <li>Contact</li>
        </ul>
    </aside>

    <!-- FEED -->
    <main class="feed">

        <!-- FEED TABS -->
        <div class="feed-header">
            <span class="active">Discover</span>
            <span>Latest</span>
            <span>Top</span>
        </div>

        <!-- POSTS -->
        <article class="post" *ngFor="let post of posts">
            <img class="cover" [src]="post.coverImage" />

            <div class="post-body">
                <h2 class="title">{{ post.title }}</h2>

                <p class="excerpt">
                    {{ post.excerpt }}
                </p>

                <div class="tags">
                    <span *ngFor="let tag of post.tags">#{{ tag }}</span>
                </div>

                <div class="post-footer">
                    <div class="meta">
                        <span class="user">{{ post.author }}</span>
                        <span> · {{ post.timeAgo }}</span>
                    </div>

                    <div class="actions">
                        <span class="save">🔖</span>
                        <button class="read">Read more</button>
                    </div>
                </div>
            </div>
        </article>

    </main>

    <!-- RIGHT SIDEBAR -->
    <aside class="sidebar right">

        <div class="card">
            <h4>Trending Topics</h4>
            <div class="pill-group">
                <span *ngFor="let topic of trendingTopics">{{ topic }}</span>
            </div>
        </div>

        <div class="card">
            <h4>Trending Tags</h4>
            <div class="tag-cloud">
                <span *ngFor="let tag of trendingTags">#{{ tag }}</span>
            </div>
        </div>

    </aside>

</div>
