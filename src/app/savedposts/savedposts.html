<app-navbar></app-navbar>
<app-loader *ngIf="isLoading"></app-loader>

<div class="page-wrapper">

    <!-- Back button -->
    <button type="button" class="btn ghost back-btn" routerLink="/">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#00000">
            <path d="M560-280 360-480l200-200v400Z" />
        </svg>
        Back To Home
    </button>

    <!-- EMPTY STATE -->
    <div class="empty-state" *ngIf="!isLoading && posts.length === 0">
        <div class="empty-illustration">
            <span class="emoji">🔖</span>
            <span class="line"></span>
        </div>

        <h2>No saved posts</h2>

        <p>
            You haven’t saved any posts yet.
            Save posts to read them later — they’ll show up here.
        </p>

        <a class="empty-link" routerLink="/">
            Explore posts →
        </a>
    </div>

    <!-- POSTS GRID -->
    <div class="posts-grid" *ngIf="posts.length > 0">

        <article class="post" *ngFor="let post of posts">
            <img class="cover" [src]="post.cover_image" />

            <div class="post-body">
                <h2 class="title">{{ post.title }}</h2>

                <p class="excerpt">{{ post.content }}</p>

                <div class="tags">
                    <span *ngFor="let tag of post.tags">#{{ tag }}</span>
                </div>

                <div class="post-footer">
                    <div class="meta">
                        <span class="user">{{ post.username }}</span>
                        <span> · {{ post.timeAgo }}</span>
                    </div>

                    <div class="actions">
                        <span class="bookmark">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="#000000"
                                viewBox="0 0 24 24">
                                <path
                                    d="M18 2H6c-1.1 0-2 .9-2 2v17c0 .36.19.69.5.87s.69.18 1 0l6.5-3.72 6.5 3.72c.15.09.32.13.5.13s.35-.04.5-.13c.31-.18.5-.51.5-.87V4c0-1.1-.9-2-2-2m0 8v9.28l-5.5-3.14a.98.98 0 0 0-.99 0l-5.5 3.14V4h12v6Z">
                                </path>
                            </svg>
                        </span>
                        <button class="read" (click)="onRead(post.id)">
                            Read more
                        </button>
                    </div>
                </div>
            </div>
        </article>

    </div>
